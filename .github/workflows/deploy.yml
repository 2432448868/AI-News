name: Daily update & deploy
on:
  push:
    branches: [main, master]
  schedule:
    # UTC: Beijing 08:23 and 14:23. The second run provides redundancy.
    - cron: '23 0,6 * * *'
  workflow_dispatch:
    inputs:
      use_snapshot:
        description: 'Skip collection and deploy the checked-in snapshot (recovery only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore previous source snapshots
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/feed.json
          key: feed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-v1-
      - name: Collect free public feeds
        if: github.event_name != 'workflow_dispatch' || !inputs.use_snapshot
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and build
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save validated snapshot for the next update
        if: github.event_name != 'workflow_dispatch' || !inputs.use_snapshot
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/feed.json
          key: feed-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
